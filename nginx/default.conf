map $http_upgrade $docs_connection_upgrade {
  default upgrade;
  ''      close;
}

# docs.surveyor.work tünelde nginx-web:80'e bakıyor; Host ile CasualOffice'e ayır.
server {
  listen 80;
  server_name docs.surveyor.work;

  client_max_body_size 100m;
  client_body_timeout 300s;
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    set $docs_origin http://docs-nginx:80;
    proxy_pass $docs_origin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $docs_connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
    proxy_request_buffering off;
  }
}

# Ana sayfa giriş kapısı. AI /ai/ altında, düşey güzergâh /dusey/ altında.
server {
  listen 80 default_server;
  server_name _;

  resolver 127.0.0.11 valid=30s;
  client_max_body_size 55m;

  location = / {
    root /usr/share/nginx/portal;
    try_files /index.html =404;
  }

  location = /ai {
    return 301 /ai/;
  }

  location /ai/ {
    alias /usr/share/nginx/html/;
    index index.html;
  }

  location = /dusey {
    return 301 /dusey/;
  }

  location ~ ^/dusey/(.*)$ {
    set $dusey_origin http://dusey-guzergah:8080;
    set $dusey_path /$1$is_args$args;
    proxy_pass $dusey_origin$dusey_path;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location ~ ^/api/(.*)$ {
    set $ai_backend http://backend:8000;
    set $survey_api_path /api/$1;
    proxy_pass $ai_backend$survey_api_path;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Connection "";
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    if ($request_method = OPTIONS) { return 204; }
  }

  location /health {
    proxy_pass http://backend:8000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /hooks/ {
    proxy_pass http://webhook:9000$request_uri;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  location ~ ^/webgis/api/(.*)$ {
    set $webgis_backend http://webgis-backend:8000;
    set $api_path /api/$1;
    proxy_pass $webgis_backend$api_path;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Connection '';
  }

  location /webgis/health {
    set $webgis_backend http://webgis-backend:8000;
    proxy_pass $webgis_backend/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /geoserver/ {
    proxy_pass http://webgis-geoserver:8080/geoserver/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /geoserver;

    proxy_read_timeout 120s;
    client_max_body_size 50m;
}

}