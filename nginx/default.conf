server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=30s;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Değişken + path ile proxy_pass, kalan URI'yi düşürür (/api/user/config → /api/).
  # Tam path için regex + $1 (webgis ile aynı mantık).
  location ~ ^/api/(.*)$ {
    set $ai_backend http://backend:8000;
    set $survey_api_path /api/$1;
    proxy_pass $ai_backend$survey_api_path;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Connection "";
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    if ($request_method = OPTIONS) { return 204; }
  }

  location /health {
    proxy_pass http://backend:8000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /hooks/ {
    set $webhook http://webhook:9000;
    proxy_pass $webhook/hooks/;
    proxy_http_version 1.1;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  location ~ ^/webgis/api/(.*)$ {
    set $webgis_backend http://webgis-backend:8000;
    set $api_path /api/$1;
    proxy_pass $webgis_backend$api_path;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /webgis/health {
    set $webgis_backend http://webgis-backend:8000;
    proxy_pass $webgis_backend/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /geoserver/ {
    proxy_pass http://webgis-geoserver:8080/geoserver/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /geoserver;

    proxy_read_timeout 120s;
    client_max_body_size 50m;
}

}