server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Frontend -> /api/... -> Backend API (OAuth + Rate Limiting)
  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Streaming için kritik ayarlar
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600;

    # Bazı ortamlarda sıkıştırma buffering'e sebep olabiliyor
    proxy_set_header Accept-Encoding "";
    proxy_set_header Connection "";

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    if ($request_method = OPTIONS) { return 204; }
  }

  # Backend health check
  location /health {
    proxy_pass http://backend:8000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # GitHub Webhook -> webhook container
  location /hooks/ {
    proxy_pass http://webhook:9000/hooks/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_read_timeout 60s;
  }

  # WebGIS Node API  →  prefix soyulur
  location /webgis/api/ {
      resolver 127.0.0.11 valid=30s;
      set $webgis_upstream http://webgis-backend:8000;
      proxy_pass $webgis_upstream/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
  }
  # WebGIS health check
  location /webgis/health {
      resolver 127.0.0.11 valid=30s;
      set $webgis_upstream http://webgis-backend:8000;
      proxy_pass $webgis_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
  }
  # GeoServer  →  /webgis/geoserver/* prefix soyulur, /geoserver/* olarak iletilir
  location /webgis/geoserver/ {
      resolver 127.0.0.11 valid=30s;
      set $geoserver_upstream http://webgis-geoserver:8080;
      proxy_pass $geoserver_upstream/geoserver/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_redirect http://webgis-geoserver:8080/geoserver/ /webgis/geoserver/;
      proxy_read_timeout 120s;
      client_max_body_size 50m;
  }
}
